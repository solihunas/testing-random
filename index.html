<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Trading Platform</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --blue:   #1565c0;
      --blue2:  #1976d2;
      --green:  #26a69a;
      --red:    #ef5350;
      --border: #e0e0e0;
      --scale-bg: #fafafa;
      --grid:   #f2f2f2;
      --text:   #212121;
      --muted:  #9e9e9e;
    }

    html, body {
      height: 100%; height: 100dvh;
      background: #fff;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Toolbar ── */
    .toolbar {
      height: 48px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
    }

    .tb-left { display: flex; align-items: center; }
    .tb-right { display: flex; align-items: center; gap: 18px; margin-left: auto; }

    .hamburger {
      display: flex; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 4px; width: 32px;
    }
    .hamburger span { display: block; height: 2px; background: #333; border-radius: 2px; }

    .tb-icon {
      cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 6px;
      transition: background .15s;
    }
    .tb-icon:hover { background: #f5f5f5; }
    .tb-icon svg { width: 20px; height: 20px; }

    .tf-btn {
      background: none; border: none; font-size: 13px; font-weight: 700;
      color: var(--text); cursor: pointer; padding: 5px 7px;
      border-radius: 6px; font-family: inherit;
      transition: background .15s;
    }
    .tf-btn:hover { background: #f5f5f5; }

    /* ── Chart Wrap ── */
    .chart-wrap {
      flex: 1; position: relative; overflow: hidden; background: #fff;
    }

    /* Symbol overlay */
    .sym-overlay {
      position: absolute; top: 10px; left: 10px;
      z-index: 10; pointer-events: none;
      line-height: 1.3;
    }
    .sym-pair {
      font-size: 14px; font-weight: 700; color: var(--blue);
      display: flex; align-items: center; gap: 3px;
    }
    .sym-pair svg { flex-shrink: 0; }
    .sym-name { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* OHLC bar overlay */
    .ohlc-bar {
      position: absolute; top: 10px; right: 90px;
      z-index: 10; pointer-events: none;
      font-size: 11px; color: var(--muted);
      display: none;
    }
    .ohlc-bar span { margin-left: 8px; }
    .ohlc-bar .ov { color: var(--text); font-weight: 600; }

    /* Canvas */
    canvas#chart {
      display: block;
      position: absolute;
      top: 0; left: 0;
      cursor: crosshair;
    }

    /* CSV drop zone (shown when no data) */
    .drop-zone {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; z-index: 15; background: #fff;
      transition: background .15s;
    }
    .drop-zone.dragover { background: #e3f2fd; }
    .drop-zone.hidden { display: none; }

    .dz-box {
      border: 2px dashed #bdbdbd; border-radius: 16px;
      padding: 32px 40px; text-align: center;
      cursor: pointer; transition: border-color .2s;
    }
    .dz-box:hover { border-color: var(--blue); }
    .dz-icon { font-size: 40px; display: block; margin-bottom: 10px; }
    .dz-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .dz-sub { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .dz-formats { font-size: 11px; color: var(--blue); margin-top: 8px; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      height: 62px; background: #fff;
      border-top: 1px solid var(--border);
      display: flex; flex-shrink: 0;
    }
    .nav-tab {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      cursor: pointer; color: var(--muted);
      font-size: 11px; font-weight: 500;
      transition: color .15s;
    }
    .nav-tab.active { color: var(--blue); }
    .nav-tab svg { width: 22px; height: 22px; }

    /* ── Sidebar drawer ── */
    .sidebar {
      position: fixed; top: 0; left: -260px;
      width: 260px; height: 100%; background: #fff;
      border-right: 1px solid var(--border);
      z-index: 100; transition: left .25s cubic-bezier(.4,0,.2,1);
      padding: 0;
    }
    .sidebar.open { left: 0; }
    .sidebar-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.35);
      z-index: 99; display: none;
    }
    .sidebar-backdrop.show { display: block; }
    .sidebar-header {
      height: 56px; display: flex; align-items: center;
      padding: 0 16px; border-bottom: 1px solid var(--border);
      font-size: 15px; font-weight: 700;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; font-size: 14px; cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
    }
    .sidebar-item:hover { background: #f9f9f9; }
    .sidebar-item svg { width: 20px; height: 20px; color: var(--blue); }

    /* ── TF Picker ── */
    .tf-picker {
      position: absolute; top: 50px; right: 12px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 10px; z-index: 50;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      display: none; overflow: hidden; min-width: 160px;
    }
    .tf-picker.open { display: block; }
    .tf-picker-item {
      padding: 11px 18px; font-size: 13px; cursor: pointer;
      font-weight: 600; border-bottom: 1px solid #f5f5f5;
    }
    .tf-picker-item:hover { background: #f5f9ff; color: var(--blue); }
    .tf-picker-item.active { color: var(--blue); }
    .tf-picker-item:last-child { border-bottom: none; }
  </style>
</head>

<script>
/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
const SCALE_W  = 76;   // price scale width (px)
const TIME_H   = 26;   // time axis height (px)
const CHART_TYPES = ['candle', 'bar', 'line'];

let candles    = [];
let viewOff    = 0;    // # candles hidden on the right
let candleW    = 9;
let gap        = 2;
let chartType  = 'candle';
let crossX     = -1;
let crossY     = -1;
let tf         = 'M15';
let symbol     = 'BTCUSDc';
let symDesc    = 'Bitcoin vs US Dollar';

// drag
let dragging   = false;
let dragX0     = 0;
let dragOff0   = 0;

// pinch
let pinch0Dist = 0;
let pinch0CW   = 9;

const canvas   = document.getElementById('chart');
const ctx      = canvas.getContext('2d');
const wrap     = document.getElementById('chartWrap');

/* ════════════════════════════════════════════
   RESIZE
════════════════════════════════════════════ */
function resize() {
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  render();
}
window.addEventListener('resize', resize);

/* ════════════════════════════════════════════
   CSV PARSING
════════════════════════════════════════════ */
function onFileSelect(e) {
  const f = e.target.files[0];
  if (!f) return;
  // update symbol from filename
  const base = f.name.replace(/\.[^.]+$/, '').toUpperCase();
  if (base) { symbol = base; document.getElementById('symPair').childNodes[0].textContent = base + ' '; }
  readFile(f);
}

function readFile(f) {
  const r = new FileReader();
  r.onload = ev => {
    const data = parseCSV(ev.target.result);
    if (!data.length) { alert('Data CSV tidak terbaca. Cek format file.'); return; }
    candles = data;
    document.getElementById('dropZone').classList.add('hidden');
    viewOff = 0;
    autoFit();
    render();
  };
  r.readAsText(f);
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const result = [];

  // detect separator: tab or comma
  const sep = (lines[0].split('\t').length > lines[0].split(',').length) ? '\t' : ',';

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw) continue;
    const cols = raw.split(sep).map(s => s.trim().replace(/["']/g, ''));
    if (cols.length < 5) continue;

    let t, o, h, l, c, v = 0;

    // Format A: DATE TIME O H L C [VOL ...] (MT5 export)
    if (cols.length >= 6 && /^\d{2}[:\/\-]\d{2}/.test(cols[1])) {
      const dateStr = cols[0].replace(/\./g, '-');
      t = new Date(`${dateStr}T${cols[1]}`);
      o = +cols[2]; h = +cols[3]; l = +cols[4]; c = +cols[5];
      v = +cols[6] || 0;
    }
    // Format B: DATETIME O H L C [VOL] — datetime in one column
    else {
      t = new Date(cols[0].replace(/\./g, '-'));
      o = +cols[1]; h = +cols[2]; l = +cols[3]; c = +cols[4];
      v = +cols[5] || 0;
    }

    if (!t || isNaN(t.getTime()) || isNaN(o) || isNaN(h)) continue;
    if (o <= 0 || h <= 0) continue;

    result.push({ t, o, h, l, c, v });
  }

  return result.sort((a, b) => a.t - b.t);
}

/* ════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════ */
function autoFit() {
  const W = canvas.width - SCALE_W;
  const n = Math.min(100, candles.length);
  const step = Math.max(3, Math.floor(W / n));
  candleW = Math.max(2, step - 2);
  gap = step - candleW;
}

function getStep() { return candleW + gap; }

function visibleRange() {
  const W = canvas.width - SCALE_W;
  const step = getStep();
  const count = Math.ceil(W / step) + 1;
  const end   = Math.max(1, candles.length - viewOff);
  const start = Math.max(0, end - count);
  return { start, end };
}

function priceRange(start, end) {
  let mn = Infinity, mx = -Infinity;
  for (let i = start; i < end; i++) {
    if (candles[i].l < mn) mn = candles[i].l;
    if (candles[i].h > mx) mx = candles[i].h;
  }
  if (mn === Infinity) return { min: 0, max: 1 };
  const pad = (mx - mn) * 0.08 || mn * 0.001;
  return { min: mn - pad, max: mx + pad };
}

function toY(price, mn, mx, H) {
  return Math.round(((mx - price) / (mx - mn)) * H);
}

function digits(price) {
  if (price > 1000) return 2;
  if (price > 10)   return 3;
  if (price > 1)    return 4;
  return 5;
}

function fmtP(p) { return p.toFixed(digits(p)); }

function fmtTime(d) {
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${dd} ${mo[d.getMonth()]} ${hh}:${mm}`;
}

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
function render() {
  const W = canvas.width, H = canvas.height;
  const chartW = W - SCALE_W;
  const chartH = H - TIME_H;
  ctx.clearRect(0, 0, W, H);

  // background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  if (!candles.length) return;

  const { start, end } = visibleRange();
  const vis  = candles.slice(start, end);
  const step = getStep();
  const { min: mn, max: mx } = priceRange(start, end);
  const dg   = digits(vis[vis.length - 1]?.c || 1);

  /* ── Price grid ── */
  const gridN = Math.max(4, Math.floor(chartH / 60));
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth   = 1;
  ctx.font        = '10px Roboto, sans-serif';
  ctx.fillStyle   = '#9e9e9e';
  ctx.textAlign   = 'left';
  ctx.textBaseline = 'middle';

  for (let i = 0; i <= gridN; i++) {
    const price = mn + (mx - mn) * (i / gridN);
    const y = toY(price, mn, mx, chartH);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartW, y); ctx.stroke();
    ctx.fillText(price.toFixed(dg), chartW + 5, y);
  }

  /* ── Time grid ── */
  const timeEvery = Math.max(1, Math.floor(vis.length / 5));
  ctx.fillStyle   = '#9e9e9e';
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';

  for (let i = 0; i < vis.length; i += timeEvery) {
    const x = (i + 0.5) * step;
    ctx.beginPath(); ctx.strokeStyle = '#f0f0f0';
    ctx.moveTo(x, 0); ctx.lineTo(x, chartH); ctx.stroke();
    ctx.fillText(fmtTime(vis[i].t), x, chartH + TIME_H / 2);
  }

  /* ── Scale area ── */
  ctx.fillStyle = '#fafafa';
  ctx.fillRect(chartW, 0, SCALE_W, H);
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(chartW, 0); ctx.lineTo(chartW, H); ctx.stroke();

  /* ── Time axis border ── */
  ctx.beginPath(); ctx.moveTo(0, chartH); ctx.lineTo(chartW, chartH); ctx.stroke();

  /* ── Candles / Bars / Line ── */
  if (chartType === 'line') {
    ctx.beginPath();
    ctx.strokeStyle = '#1565c0';
    ctx.lineWidth   = 1.5;
    for (let i = 0; i < vis.length; i++) {
      const x = i * step + candleW / 2;
      const y = toY(vis[i].c, mn, mx, chartH);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else {
    for (let i = 0; i < vis.length; i++) {
      const cd   = vis[i];
      const bull = cd.c >= cd.o;
      const col  = bull ? '#26a69a' : '#ef5350';
      const x    = i * step;
      const cx   = x + candleW / 2;

      const wTop = toY(cd.h, mn, mx, chartH);
      const wBot = toY(cd.l, mn, mx, chartH);
      const bTop = toY(Math.max(cd.o, cd.c), mn, mx, chartH);
      const bBot = toY(Math.min(cd.o, cd.c), mn, mx, chartH);
      const bH   = Math.max(1, bBot - bTop);

      // wick
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, wTop); ctx.lineTo(cx, wBot); ctx.stroke();

      if (chartType === 'candle') {
        ctx.fillStyle = col;
        ctx.fillRect(x, bTop, candleW, bH);
      } else {
        // OHLC bar
        ctx.strokeStyle = col; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, wTop); ctx.lineTo(cx, wBot);  // vertical
        ctx.moveTo(x, bTop); ctx.lineTo(cx, bTop);   // open tick left
        ctx.moveTo(cx, bBot); ctx.lineTo(x + candleW, bBot); // close tick right
        ctx.stroke();
      }
    }
  }

  /* ── Last price line ── */
  const last = candles[end - 1];
  if (last) {
    const y     = toY(last.c, mn, mx, chartH);
    const bull  = last.c >= last.o;
    const lCol  = bull ? '#26a69a' : '#ef5350';

    ctx.save();
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = lCol; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartW, y); ctx.stroke();
    ctx.restore();

    // price label
    const lbl = last.c.toFixed(dg);
    const lw  = ctx.measureText(lbl).width + 14;
    ctx.fillStyle = lCol;
    ctx.beginPath();
    ctx.roundRect(chartW + 2, y - 10, SCALE_W - 2, 20, 3);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '11px Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(lbl, chartW + SCALE_W / 2, y);
  }

  /* ── Crosshair ── */
  if (crossX >= 0 && crossX < chartW) {
    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(crossX, 0); ctx.lineTo(crossX, chartH);
    ctx.moveTo(0, crossY); ctx.lineTo(chartW, crossY);
    ctx.stroke();
    ctx.restore();

    // crosshair price label
    if (crossY > 0 && crossY < chartH) {
      const price = mx - (crossY / chartH) * (mx - mn);
      const lbl   = price.toFixed(dg);
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.beginPath(); ctx.roundRect(chartW + 2, crossY - 10, SCALE_W - 2, 20, 3); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '11px Roboto, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(lbl, chartW + SCALE_W / 2, crossY);
    }

    // find hovered candle
    const step2 = getStep();
    const idx2  = Math.floor(crossX / step2);
    if (idx2 >= 0 && idx2 < vis.length) {
      const cd = vis[idx2];
      const bar = document.getElementById('ohlcBar');
      bar.style.display = 'block';
      document.getElementById('oO').textContent = ' ' + cd.o.toFixed(dg);
      document.getElementById('oH').textContent = ' ' + cd.h.toFixed(dg);
      document.getElementById('oL').textContent = ' ' + cd.l.toFixed(dg);
      document.getElementById('oC').textContent = ' ' + cd.c.toFixed(dg);
    }
  } else {
    document.getElementById('ohlcBar').style.display = 'none';
  }
}

/* ════════════════════════════════════════════
   EVENTS — Mouse
════════════════════════════════════════════ */
canvas.addEventListener('mousedown', e => {
  dragging = true; dragX0 = e.clientX; dragOff0 = viewOff;
});
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  crossX = e.clientX - rect.left;
  crossY = e.clientY - rect.top;
  if (dragging) {
    const dx  = e.clientX - dragX0;
    const max = candles.length - 1;
    viewOff = Math.max(0, Math.min(max, dragOff0 - Math.round(dx / getStep())));
  }
  render();
});
canvas.addEventListener('mouseup',    () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; crossX = -1; render(); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.2 : 0.83;
  candleW = Math.max(2, Math.min(40, Math.round(candleW * f)));
  gap = Math.max(1, Math.floor(candleW * 0.22));
  render();
}, { passive: false });

/* ════════════════════════════════════════════
   EVENTS — Touch
════════════════════════════════════════════ */
let touch0X = 0, touch0Off = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touch0X = e.touches[0].clientX; touch0Off = viewOff;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinch0Dist = Math.sqrt(dx * dx + dy * dy);
    pinch0CW   = candleW;
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const dx  = e.touches[0].clientX - touch0X;
    const max = candles.length - 1;
    viewOff = Math.max(0, Math.min(max, touch0Off - Math.round(dx / getStep())));
  } else if (e.touches.length === 2) {
    const dx   = e.touches[0].clientX - e.touches[1].clientX;
    const dy   = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    candleW = Math.max(2, Math.min(40, Math.round(pinch0CW * dist / pinch0Dist)));
    gap = Math.max(1, Math.floor(candleW * 0.22));
  }
  render();
}, { passive: false });

/* ════════════════════════════════════════════
   DRAG & DROP CSV
════════════════════════════════════════════ */
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) readFile(f);
});

/* ════════════════════════════════════════════
   UI ACTIONS
════════════════════════════════════════════ */
function setTab(idx) {
  document.querySelectorAll('.nav-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

function toggleTF() {
  document.getElementById('tfPicker').classList.toggle('open');
}

function setTF(val) {
  tf = val;
  document.getElementById('tfBtn').textContent = val;
  document.getElementById('symTF').textContent = val;
  document.querySelectorAll('.tf-picker-item').forEach(el => {
    el.classList.toggle('active', el.textContent === val);
  });
  document.getElementById('tfPicker').classList.remove('open');
}

function cycleChartType() {
  const idx = CHART_TYPES.indexOf(chartType);
  chartType = CHART_TYPES[(idx + 1) % CHART_TYPES.length];
  render();
}

function openIndicators() { /* placeholder */ }

function toggleFull() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

// close TF picker on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('#tfPicker') && !e.target.closest('#tfBtn')) {
    document.getElementById('tfPicker').classList.remove('open');
  }
});

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
resize();
</script>
