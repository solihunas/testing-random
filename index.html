<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi IPI DIGITAL</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0F172A;
      --navy2:  #1E293B;
      --indigo: #4F46E5;
      --ind2:   #6366F1;
      --green:  #059669;
      --grn2:   #10B981;
      --amber:  #D97706;
      --amb2:   #F59E0B;
      --g50:    #F8FAFC;
      --g100:   #F1F5F9;
      --g200:   #E2E8F0;
      --g400:   #94A3B8;
      --g500:   #64748B;
      --g700:   #334155;
      --g900:   #0F172A;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(145deg, #0F172A 0%, #1E1B4B 50%, #4C1D95 100%);
      min-height: 100vh;
      padding-bottom: 60px;
      color: var(--g900);
    }

    /* ─ Topbar ─ */
    .topbar {
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--indigo), var(--ind2));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .brand-name { color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .3px; }
    .topbar-date { font-size: 12px; color: var(--g400); }

    /* ─ Layout ─ */
    .wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px 0; }

    /* ─ Clock Card ─ */
    .clock-card {
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      border-radius: 20px;
      padding: 28px 24px 22px;
      text-align: center;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(79,70,229,.45);
    }
    .clock-card::before {
      content:''; position:absolute; top:-50px; right:-50px;
      width:180px; height:180px; background:rgba(255,255,255,.06); border-radius:50%;
    }
    .clock-chip {
      display:inline-block;
      background:rgba(255,255,255,.15);
      color:rgba(255,255,255,.85);
      font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
      padding:4px 12px; border-radius:99px; margin-bottom:10px;
    }
    .clock-time {
      font-size:54px; font-weight:800; color:#fff;
      letter-spacing:-2px; line-height:1; margin-bottom:8px;
      position:relative; z-index:1;
    }
    .clock-date { font-size:14px; color:rgba(255,255,255,.75); font-weight:500; }

    /* ─ Card ─ */
    .card {
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 8px 40px rgba(0,0,0,.25);
      margin-bottom:14px;
    }
    .card-sec {
      padding:20px 22px;
      border-bottom:1px solid var(--g100);
    }
    .card-sec:last-child { border-bottom:none; }
    .sec-title {
      font-size:10px; font-weight:800; letter-spacing:1px;
      text-transform:uppercase; color:var(--g400); margin-bottom:12px;
    }

    /* ─ Select & Textarea ─ */
    select, textarea {
      width:100%; padding:12px 14px;
      border:1.5px solid var(--g200); border-radius:12px;
      font-size:15px; color:var(--g900); background:var(--g50);
      outline:none; font-family:inherit;
      transition:border-color .2s, box-shadow .2s;
    }
    select:focus, textarea:focus {
      border-color:var(--indigo);
      box-shadow:0 0 0 3px rgba(79,70,229,.1);
      background:#fff;
    }
    textarea { resize:vertical; min-height:80px; }

    /* ─ Jenis Toggle ─ */
    .toggle-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .tog {
      padding:14px 8px; border-radius:12px;
      border:2px solid var(--g200); background:var(--g50);
      cursor:pointer; text-align:center;
      transition:all .2s; user-select:none;
    }
    .tog .ico { font-size:22px; margin-bottom:4px; }
    .tog .lbl { font-size:14px; font-weight:700; color:var(--g500); }
    .tog .sub { font-size:11px; color:var(--g400); margin-top:1px; }
    .tog.masuk.on  { border-color:var(--grn2); background:#F0FDF4; box-shadow:0 4px 14px rgba(16,185,129,.18); }
    .tog.masuk.on .lbl { color:var(--green); }
    .tog.pulang.on { border-color:var(--amb2); background:#FFFBEB; box-shadow:0 4px 14px rgba(245,158,11,.18); }
    .tog.pulang.on .lbl { color:var(--amber); }

    /* ─ Time Info ─ */
    .time-info {
      display:flex; align-items:center; gap:10px;
      padding:12px 14px; background:var(--g50);
      border:1.5px solid var(--g200); border-radius:12px;
    }
    .time-main { font-size:15px; font-weight:700; color:var(--g900); }
    .time-sub  { font-size:11px; color:var(--g400); }

    /* ─ Submit Button ─ */
    .btn {
      width:100%; padding:15px; border:none; border-radius:13px;
      font-size:15px; font-weight:800; color:#fff;
      cursor:pointer; font-family:inherit;
      display:flex; align-items:center; justify-content:center; gap:8px;
      transition:opacity .2s, transform .15s;
    }
    .btn:hover:not(:disabled) { opacity:.91; transform:translateY(-1px); }
    .btn:active:not(:disabled){ transform:translateY(0); }
    .btn:disabled { background:var(--g200)!important; color:var(--g400); cursor:not-allowed; box-shadow:none; }
    .btn.default { background:linear-gradient(135deg,var(--indigo),var(--ind2)); box-shadow:0 6px 22px rgba(79,70,229,.4); }
    .btn.masuk   { background:linear-gradient(135deg,var(--green),var(--grn2));  box-shadow:0 6px 22px rgba(16,185,129,.4); }
    .btn.pulang  { background:linear-gradient(135deg,var(--amber),var(--amb2));  box-shadow:0 6px 22px rgba(245,158,11,.4); }

    .spin {
      width:18px; height:18px;
      border:3px solid rgba(255,255,255,.3); border-top-color:#fff;
      border-radius:50%; animation:sp .7s linear infinite; display:none;
    }
    @keyframes sp { to { transform:rotate(360deg); } }

    .foot-note { text-align:center; font-size:12px; color:var(--g400); margin-top:8px; }

    /* ─ Success Overlay ─ */
    .overlay {
      display:none; position:fixed; inset:0;
      background:var(--navy);
      flex-direction:column; align-items:center; justify-content:center;
      padding:32px 24px; z-index:99;
      animation:fi .3s ease;
    }
    .overlay.show { display:flex; }
    @keyframes fi { from { opacity:0; } to { opacity:1; } }

    .suc-icon {
      width:92px; height:92px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-size:42px;
      margin-bottom:22px;
      animation:po .5s cubic-bezier(.175,.885,.32,1.275) .1s both;
      box-shadow:0 12px 40px rgba(0,0,0,.4);
    }
    .suc-icon.masuk  { background:linear-gradient(135deg,var(--green),var(--grn2)); }
    .suc-icon.pulang { background:linear-gradient(135deg,var(--amber),var(--amb2)); }
    @keyframes po { from { transform:scale(0);opacity:0; } to { transform:scale(1);opacity:1; } }

    .suc-title { font-size:26px; font-weight:800; color:#fff; margin-bottom:8px; text-align:center; }
    .suc-sub   { font-size:13px; color:var(--g400); margin-bottom:28px; text-align:center; line-height:1.6; }

    .suc-card {
      background:var(--navy2); border:1px solid rgba(255,255,255,.08);
      border-radius:16px; padding:18px; width:100%; max-width:360px; margin-bottom:24px;
    }
    .suc-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06);
      font-size:14px;
    }
    .suc-row:last-child { border-bottom:none; }
    .suc-k { color:var(--g400); font-weight:500; }
    .suc-v { color:#fff; font-weight:700; }
    .badge {
      padding:3px 10px; border-radius:99px;
      font-size:12px; font-weight:700;
    }
    .badge.masuk  { background:rgba(16,185,129,.15); color:var(--grn2); }
    .badge.pulang { background:rgba(245,158,11,.15);  color:var(--amb2); }

    .btn-back {
      padding:13px 36px;
      background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.12);
      border-radius:13px; color:#fff; font-size:14px; font-weight:700;
      cursor:pointer; font-family:inherit; transition:background .2s;
    }
    .btn-back:hover { background:rgba(255,255,255,.14); }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">🏢</div>
    <span class="brand-name">IPI DIGITAL</span>
  </div>
  <div class="topbar-date" id="tpDate"></div>
</div>

<div class="wrap">

  <!-- Jam -->
  <div class="clock-card">
    <div class="clock-chip">⏰ Waktu Sekarang</div>
    <div class="clock-time" id="clkTime">--:--:--</div>
    <div class="clock-date" id="clkDate">-</div>
  </div>

  <!-- Form Card -->
  <div class="card">

    <!-- Nama -->
    <div class="card-sec">
      <div class="sec-title">Nama Karyawan</div>
      <select id="selNama">
        <option value="">— Pilih nama Anda —</option>
        <option>Uung</option>
        <option>Solihun</option>
        <option>Adi</option>
        <option>Saputra</option>
        <option>Solihun Adi</option>
        <option>Adi Saputra</option>
        <option>Solihun Saputra</option>
        <option>Amung</option>
        <option>Kembar</option>
      </select>
    </div>

    <!-- Jenis -->
    <div class="card-sec">
      <div class="sec-title">Jenis Absen</div>
      <div class="toggle-row">
        <div class="tog masuk" id="tMasuk" onclick="pilih('masuk')">
          <div class="ico">🟢</div>
          <div class="lbl">Masuk</div>
          <div class="sub">Mulai kerja</div>
        </div>
        <div class="tog pulang" id="tPulang" onclick="pilih('pulang')">
          <div class="ico">🟠</div>
          <div class="lbl">Pulang</div>
          <div class="sub">Selesai kerja</div>
        </div>
      </div>
    </div>

    <!-- Waktu -->
    <div class="card-sec">
      <div class="sec-title">Waktu Tercatat Otomatis</div>
      <div class="time-info">
        <span style="font-size:20px">🕐</span>
        <div>
          <div class="time-main" id="infoWkt">--:--:--</div>
          <div class="time-sub"  id="infoTgl">-</div>
        </div>
      </div>
    </div>

    <!-- Catatan -->
    <div class="card-sec">
      <div class="sec-title">Catatan <span style="font-weight:400;text-transform:none;font-size:10px;color:#94A3B8">(opsional)</span></div>
      <textarea id="txtCat" placeholder="Izin terlambat, lembur, WFH, dll..."></textarea>
    </div>

    <!-- Submit -->
    <div class="card-sec">
      <button class="btn default" id="btnSub" onclick="submit()" disabled>
        <div class="spin" id="spin"></div>
        <span id="btnLbl">Pilih nama &amp; jenis absen dulu</span>
      </button>
      <p class="foot-note">Data langsung tersimpan ke Google Sheets 📋</p>
    </div>

  </div><!-- /card -->
</div>

<!-- ══ SUKSES OVERLAY ══ -->
<div class="overlay" id="ovSukses">
  <div class="suc-icon" id="sucIco">✓</div>
  <div class="suc-title" id="sucTitle">Absen Berhasil!</div>
  <div class="suc-sub"   id="sucSub">Data Anda telah tersimpan.</div>

  <div class="suc-card">
    <div class="suc-row"><span class="suc-k">Nama</span>   <span class="suc-v" id="rNama">-</span></div>
    <div class="suc-row"><span class="suc-k">Jenis</span>  <span id="rJenis"></span></div>
    <div class="suc-row"><span class="suc-k">Waktu</span>  <span class="suc-v" id="rWaktu">-</span></div>
    <div class="suc-row"><span class="suc-k">Tanggal</span><span class="suc-v" id="rTgl">-</span></div>
    <div class="suc-row"><span class="suc-k">Catatan</span><span class="suc-v" id="rCat">-</span></div>
  </div>

  <button class="btn-back" onclick="kembali()">← Absen Lagi</button>
</div>

<!-- Hidden iframe target untuk form submit (hindari reload halaman) -->
<iframe name="frm_target" style="display:none"></iframe>

<script>
  /* ══ CONFIG ══ */
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFzwtECHFLITlKIufspKIOHL2Ve3jqyi0udbTvNTF4VE6OzrwrUldfF1BAwuw34uIt/exec';

  /* ══ CLOCK ══ */
  const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const pad   = n => String(n).padStart(2,'0');

  function fmtWaktu(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  function fmtTgl(d)  { return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; }
  function fmtTglS(d) { return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; }

  function tick() {
    const n = new Date();
    const w = fmtWaktu(n), t = fmtTgl(n);
    document.getElementById('clkTime').textContent  = w;
    document.getElementById('clkDate').textContent  = t;
    document.getElementById('infoWkt').textContent  = w;
    document.getElementById('infoTgl').textContent  = t;
    document.getElementById('tpDate').textContent   = t;
  }
  setInterval(tick, 1000); tick();

  /* ══ JENIS ══ */
  let jenis = null;
  function pilih(j) {
    jenis = j;
    document.getElementById('tMasuk').classList.toggle('on',  j==='masuk');
    document.getElementById('tPulang').classList.toggle('on', j==='pulang');
    cekBtn();
  }

  document.getElementById('selNama').addEventListener('change', cekBtn);

  function cekBtn() {
    const nama = document.getElementById('selNama').value;
    const btn  = document.getElementById('btnSub');
    const lbl  = document.getElementById('btnLbl');
    if (!nama && !jenis)   { lbl.textContent='Pilih nama & jenis absen dulu'; btn.className='btn default'; btn.disabled=true; return; }
    if (!nama)             { lbl.textContent='Pilih nama karyawan dulu';       btn.className='btn default'; btn.disabled=true; return; }
    if (!jenis)            { lbl.textContent='Pilih Masuk atau Pulang';         btn.className='btn default'; btn.disabled=true; return; }
    const ico = jenis==='masuk' ? '🟢' : '🟠';
    const kat = jenis==='masuk' ? 'Masuk' : 'Pulang';
    lbl.textContent = `${ico}  Catat Absen ${kat}`;
    btn.className   = `btn ${jenis}`;
    btn.disabled    = false;
  }

  /* ══ SUBMIT via hidden form → iframe (100% tanpa CORS) ══ */
  function submit() {
    const now     = new Date();
    const nama    = document.getElementById('selNama').value;
    const waktu   = fmtWaktu(now);
    const tanggal = fmtTglS(now);
    const catatan = document.getElementById('txtCat').value.trim() || '-';

    // Loading
    document.getElementById('btnSub').disabled = true;
    document.getElementById('spin').style.display = 'block';
    document.getElementById('btnLbl').textContent = 'Menyimpan...';

    // Kirim via GET params (simple request, no CORS preflight, tidak ada body yang hilang di redirect)
    const params = new URLSearchParams({ nama, jenis, waktu, tanggal, catatan });
    fetch(SCRIPT_URL + '?' + params.toString(), { method: 'GET', mode: 'no-cors' })
      .catch(() => {});

    // Tampilkan sukses setelah 2 detik
    setTimeout(() => tampilSukses({ nama, jenis, waktu, tanggal, catatan }), 2000);
  }

  function tampilSukses(d) {
    document.getElementById('rNama').textContent  = d.nama;
    document.getElementById('rWaktu').textContent = d.waktu;
    document.getElementById('rTgl').textContent   = d.tanggal;
    document.getElementById('rCat').textContent   = d.catatan;
    document.getElementById('rJenis').innerHTML   =
      `<span class="badge ${d.jenis}">${d.jenis==='masuk'?'🟢 Masuk':'🟠 Pulang'}</span>`;

    const ico   = document.getElementById('sucIco');
    const title = document.getElementById('sucTitle');
    const sub   = document.getElementById('sucSub');

    if (d.jenis==='masuk') {
      ico.className='suc-icon masuk'; ico.textContent='✓';
      title.textContent='Selamat Datang! 👋';
      sub.textContent=`Absen masuk ${d.nama} pukul ${d.waktu} tercatat.`;
    } else {
      ico.className='suc-icon pulang'; ico.textContent='🏠';
      title.textContent='Sampai Jumpa! 👋';
      sub.textContent=`Absen pulang ${d.nama} pukul ${d.waktu} tercatat.`;
    }

    document.getElementById('ovSukses').classList.add('show');
    document.getElementById('spin').style.display='none';
  }

  function kembali() {
    document.getElementById('ovSukses').classList.remove('show');
    document.getElementById('selNama').value = '';
    document.getElementById('txtCat').value  = '';
    jenis = null;
    document.getElementById('tMasuk').classList.remove('on');
    document.getElementById('tPulang').classList.remove('on');
    document.getElementById('btnSub').disabled = true;
    document.getElementById('btnLbl').textContent = 'Pilih nama & jenis absen dulu';
    document.getElementById('btnSub').className = 'btn default';
  }
</script>

</body>
</html>
